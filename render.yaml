# Blueprint de Render (https://render.com/docs/blueprint-spec). Importar este
# repo en Render como "Blueprint" crea el servicio con esta config ya cargada;
# solo faltará completar a mano los envVars marcados `sync: false` (secretos
# que Render no debe generar ni versionar). Ver DEPLOY.md para el paso a paso.
services:
  - type: web
    name: piura-alerta-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render pone un proxy delante: ver src/utilidades/proxy.js.
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SENSOR_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # URL del frontend en Render (ej. https://piura-alerta-frontend.onrender.com),
      # para los enlaces de los correos (confirmar correo, pagos).
      - key: FRONTEND_URL
        sync: false
      # Opcionales: si quedan vacíos, cada función se desactiva sola sin
      # afectar el resto (ver .env.example).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contacto@piuraalerta.pe
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        value: onboarding@piuraalerta.pe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DNI_API_TOKEN
        sync: false
